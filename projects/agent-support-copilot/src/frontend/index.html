<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Support Copilot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header><div><span class="eyebrow">AI OPERATIONS CONSOLE</span><h1>Agent Support Copilot</h1><p>订单查询、规则检索与人工工单协作。</p></div><span id="health" class="status">检查服务中</span></header>
      <section class="layout">
        <aside><h2>可演示能力</h2><button data-message="ORD-1002 的订单状态是什么？">订单状态</button><button data-message="未开始的订单可以退款吗？">退款规则</button><button data-message="我遇到异常，想找人工客服。">人工工单</button><div class="stack"><span>Tool calling</span><span>Memory</span><span>Retrieval</span><span>Audit trace</span></div></aside>
        <section class="chat"><div id="messages" class="messages"><div class="bubble assistant">你好，我是支持助手。你可以查询订单、询问规则，或在确认后创建人工工单。</div></div><div id="confirm" class="confirm hidden"><span>即将创建人工工单</span><button id="confirmButton">确认创建</button></div><form id="form"><input id="input" autocomplete="off" placeholder="输入问题，例如：ORD-1002 到哪一步了？" /><button>发送</button></form><div id="trace" class="trace"></div></section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
